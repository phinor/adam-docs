- image: family-alerts-02.png
  captured: 2026-08-13
  as: staff
  path: Families tab → Security → Manage Family Alerts
  frame:
    mode: element
    selectors: "#table_1"
    padding: 0
  setup: >
    The demonstration school had no pupils assigned to any pupil login
    permission group, so the new "Current Pupils" column read 0 on every row and
    the picture said nothing. Through ADAM's own screens: three classes were
    assigned to groups on Pupils tab → Security → Change permissions groups for
    a class (class 7160 → Full Access, 7161 → No Markbook,
    7173 → No Reports, giving 24/23/18 current pupils); the "Receive Family
    Alerts" permission was granted to pupils on the Full Access group so the
    "Sent to Pupil" column shows a Yes as well as a No; and a spread of alert
    boxes was ticked on the configuration table itself so that no column is
    uniformly empty.
  revert: none
  note: >
    Re-capture. The previous image predated the "Current Pupils" and "Roll Call"
    columns, and showed an em dash in the "Sent to…" columns which ADAM no
    longer renders — it prints Yes or No.

