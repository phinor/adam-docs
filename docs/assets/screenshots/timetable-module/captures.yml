- image: timetable-module-10.png
  captured: 2026-08-04
  path: Administration tab → Timetables → Manage schedules → schedule (Guest speaker)
  frame:
    mode: span
    selectors: main#body in full
    padding: 8
  setup: >
    This image has to show a schedule with lesson 1 empty and lesson 7 brought
    forward to the start of the day, because the paragraph after it describes
    exactly that. No such schedule existed any more — the original demonstration
    "Guest speaker" schedule is gone, and the closest survivor ("Change for
    Councillor Induction 2025") has lesson 1 empty but lesson 7 last, which is
    only half the point.

    A new enabled schedule was therefore created through Add new Time Table
    Schedule: name "Guest speaker", short "guest", no notes. Its periods were
    set to 1 empty, 2 = 0845-0930, 3 = 0930-1015, 4 = 1045-1130, 5 = 1130-1215,
    6 = 1215-1300, 7 = 0800-0845 — the same shape as the original image. Created
    through the interface, not by writing to the database.
  revert: >
    Left in place deliberately, so the image can be reproduced and so the
    schedules list in image 07 matches. It also gives the demonstration school
    an example of the "guest speaker" case the page's calendar section refers to.

