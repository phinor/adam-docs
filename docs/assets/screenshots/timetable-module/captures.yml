- images: [timetable-module-14.png, timetable-module-15.png, timetable-module-16.png, timetable-module-17.png]
  captured: 2026-08-04
  path: Administration tab → Timetables → Manage timetables → lessons (Term 2 2026) → edit (Grade 12)
  frame:
    mode: span
    selectors: >
      14 — the Grade 12 h2 down to the bottom of the card holding the filter
      and the class list. Anchored on that outer card, not the inner scrolling
      container, so the card's bottom border closes.

      15 — the same card alone, with "Mat" typed into the filter.

      16 — the card plus the grid header and the Mon A row. 980px wide rather
      than 900: the grid is 916px at a 900px viewport and the Action column with
      its detail button was being clipped.

      17 — the same frame as 16, with two class cards selected.
    padding: 8
  setup: >
    For 15, "Mat" was typed into the Filter box, narrowing 116 classes to the
    four Mathematics classes. For 17, two Mat Grade 12 GM5 (Mr Mann) cards were
    clicked, in lessons 3 and 5 of Mon A. Selection is client-side only and is
    not saved, so nothing was written to the demonstration school and no drag
    was performed.
  note: >
    THIS SCREEN HAS BEEN REBUILT and the four images do not show variants of the
    old one — they show a different interface. The old screen had a multi-select
    list of classes, a grid of tick boxes with counts in brackets, a hover hint
    listing the classes in a lesson, automatic yellow highlighting of every
    lesson sharing the same combination, a "Replace all existing classes on the
    selected lessons?" checkbox and a Save Lessons button.

    None of that exists. The screen now has 543 draggable class cards, no
    checkbox anywhere, no select element, and no form or submit button at all —
    changes are saved as they are made. Ctrl no longer multi-selects; it now
    means "copy instead of move" when held during a drop. Multi-select is a
    plain click, and selections in the top list and in the grid clear each
    other. The filter no longer highlights matches, it hides non-matches.

    The prose of "Adding Lessons to the Timetable" described the old screen
    step by step and was rewritten to match, because leaving it would have
    paired new pictures with instructions that contradict them. That rewrite
    goes beyond a screenshot refresh and is worth a careful read.

