- image: timetable-module-20.png
  captured: 2026-08-04
  path: Administration tab → Timetables → Manage calendar
  frame:
    mode: span
    selectors: the upcoming schedule table in full
    padding: 8
  setup: >
    The demonstration school had NO upcoming calendar days at all — the
    Upcoming schedule read "(no records to display)", and the historical view
    has no per-row edit or remove action, so there was nothing to photograph.

    Five days were added through Add multiple days to the calendar: 2026-08-10
    to 2026-08-14, school days Monday to Friday, cycle days Monday A to Friday A,
    all five grades, first day of the cycle Monday A, Wednesday on the
    "Wednesday" schedule and the other four on "Mon, Tues, Thur, Fri" — the
    pattern the school's own historical data already follows.
  revert: >
    Left in place. The demonstration school having no upcoming timetable at all
    is a gap in the demonstration data rather than a state worth restoring, and
    images 22 and 24 depend on these days existing.
  note: >
    The columns wrap and the edit/remove buttons stack at 900px. Widening the
    viewport to 1040px was tried and did not change the row height, so the
    900px version was kept.

- images: [timetable-module-22.png, timetable-module-24.png]
  captured: 2026-08-04
  path: Staff Information → Grant Mann (staff 139) → calendar
  frame:
    mode: span
    selectors: >
      22 — the Calendar h1 down to the bottom of the subscribe paragraph,
      taking in the View Timetable and PDF Timetable links.

      24 — the "Friday, 14 August" day heading down to the bottom of the
      notification box holding the reset link, so the notice is seen sitting at
      the foot of the calendar rather than floating alone.
    padding: 8
  setup: >
    Grant Mann was chosen because the block only renders when the staff member
    has lessons in the next four weeks; the logged-in demonstration user, Vivek
    Vilakazi, teaches nothing and the page reads "There are no lessons
    scheduled." The lessons come from the calendar days added for image 20.
  note: >
    Two false starts on 24, both fixed on review rather than shipped. It was
    first framed on the notification alone, which lost any sense of where on the
    page it sits. It was then re-framed with the last day of the calendar above
    it, but anchored on the inner div.message, whose box stops 17px short of the
    div.notification wrapper that actually draws the border — so the rounded
    border was sliced off at the bottom edge. The final version anchors on the
    .notification wrapper.

    The wording has changed since the originals. The subscribe line is now
    "Subscribe to Grant Mann's Calendar — If clicking on that link doesn't work,
    click here for further instructions", where it used to put the calendar link
    inline in a sentence. The reset notice now says "this calendar" rather than
    "this timetable". Both were corrected on the page.

    The originals showed "Philip Norton's Timetable" — a real name, from a real
    installation, which is exactly what capturing against the demonstration
    school avoids.
