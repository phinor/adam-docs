# All images on this page were re-captured on 2026-08-04. Every one of them
# predated the current interface — the originals were flat-blue tables on white
# from the pre-rebuild ADAM, and several carried yellow highlight annotations
# added by hand in the original Google Doc (04, 12, 13, 20, 22, 24). House rules
# no longer allow annotations, so none of the new images has one. Image 17 also
# included full browser chrome, with an address bar and tab titles naming two
# other schools; that is gone too.
#
# Standing details for every entry below unless it says otherwise:
#   as:      staff (the dev bypass login, staff_id 1, Vivek Vilakazi)
#   frame:   span mode, 8px padding, 900px viewport width
#   revert:  none

- images: [timetable-module-02.png, timetable-module-04.png, timetable-module-12.png]
  captured: 2026-08-04
  path: Administration tab → Timetables → Manage timetables
  frame:
    mode: span
    selectors: >
      02 runs from main#body's top to the bottom of the first table — the
      Manage timetables heading, the Add new Timetable button, the Timetables
      heading and the single enabled timetable. It deliberately stops before
      the Disabled Timetables heading: the demonstration school now has 15
      disabled timetables, and including them would have made the image four
      times as tall for no gain.

      04 and 12 are a tighter frame of the same screen, from the Timetables h2
      to the bottom of that table, so the row's four action buttons are the
      subject.
    padding: 8
  setup: none
  note: >
    04 and 12 are the same frame of the same screen and are effectively the
    same picture. In the originals they were distinguished only by which link
    carried a yellow highlight — "days" in 04, "lessons" in 12 — and with
    annotations no longer permitted there is nothing left to tell them apart.
    Both are also close to 02. The page would read better with one of the three
    dropped; that is an editorial decision, so all three have been captured
    rather than silently removing a reference.

