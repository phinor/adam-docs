  captured: 2026-08-04
  path: Administration tab → Timetables → Manage calendar → Add a single date to the calendar
  frame:
    mode: span
    selectors: main#body in full — Add a Day heading through Save the calendar entries
    padding: 8
  setup: none
  note: >
    The original showed the Edit a Day form for an existing date. This is the
