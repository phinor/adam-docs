- image: pupil-photographs-03.png
  captured: 2026-09-22
  as: staff
  path: >
    Pupils tab → Names and Faces → Upload new pupil photographs, four files
    chosen, Upload pictures clicked
  frame:
    mode: element
    selectors: main#body
    padding: 8
  setup: >
    Four JPEGs were uploaded against the "Current Pupils" dataset, each name
    chosen to exercise a different convention: "Alcock Kate.jpg" (last first,
    → Kate Alcock, pupil 5235), "Ewan Allen.jpg" (first last, → Ewan Allen),
    "30851.jpg" (admin number, → Jacqui Adams) and "Anabel Atkinson.jpg"
    (Annabel Atkinson misspelt, so it stays unmatched and shows the NOT FOUND
    card). The pictures themselves are the cartoon figures cropped out of the
    manual's own earlier pupil-photographs images, so the demonstration school
    keeps the look it already had.
  revert: none — the demonstration database is disposable
  note: >
    The cards stack one per row because .photo-upload is display:grid with no
    grid-template-columns (see resources/scss/theme/default/_photo-upload.scss).
    The pre-January 2026 legacy page flowed them side by side, which is why the
    old image showed four across. Re-capture this shot if that rule is fixed.

