  setup: >
    portal_pronunciation_prompt was switched to Yes through
    Administration → Site Administration → Edit site settings → Pupils &
    Families → Widgets, and switched back to No immediately afterwards.

    A pupil login was used rather than a parent's because the prompt only
    appears for somebody with NO recording at all, and family 3101 — the one
