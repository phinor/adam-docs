    therefore reach the portal front page — already has approved clips for
    both its children.

    ONE CHANGE WAS MADE THAT CANNOT BE UNDONE THROUGH ADAM: this pupil's
    outstanding online agreement was accepted, by clicking "I agree to the
    conditions stated above.", because the front page is unreachable until it
    is answered. That writes a row to onlineagreement_responses for pupil
    1624. It is demonstration data and a lorem-ipsum agreement, but it is a
    real acceptance and is recorded here rather than left to be discovered.
  revert: >
    portal_pronunciation_prompt returned to No (verified by re-reading the
    form). The agreement acceptance stands.

