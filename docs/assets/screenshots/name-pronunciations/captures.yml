- image: name-pronunciations-07.png
  captured: 2026-09-22
  as: pupil 1624 (Sienna Mthembu), reached through Pupils → Security → Login as a pupil
  path: portal front page
  frame:
    mode: element
    selectors: the div.section.col_third whose h3 is "How we say a name"
