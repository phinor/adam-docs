- image: profile-overview-customisation-15.png
  captured: 2026-08-04
  as: staff
  path: /admin/overview/layouts/pupil/people ("see who is using which layout" above the catalogue)
  frame:
    mode: span
    selectors: >
      The "Pupil Overview: who uses what" heading through the eighth table
      row (header row plus seven staff), which is the shortest span that
      shows all three How states.
    padding: 8
  setup: >
    The roster had no "own choice" row at all — 88 following the default and
    9 assigned — because nobody held the "Choose own Pupil Overview layout"
    permission. Granted that permission to the "General Teacher" group (saved),
    then used Staff → Security → Login as another staff member to sign in as
    Shaun Acutt (staff_id 193, a member of that group) and chose the "Medical"
    layout for them. Medical was picked over Admin Layout so the three How
    states also show three different layout names. Acutt sorts first
    alphabetically, so all three states land in the top rows together.
  revert: >
    Not reverted, and deliberately so: the permission grant and Acutt's choice
    are what make the screen illustrate its own documentation. Both match the
    advice in the surrounding text that most teachers get the choose-own
    permission.
  note: >
    INCOMPLETE against its brief. The brief also asked for the "Move selected
    to:" control and its "Move selected" button at the foot of the screen. The
    demonstration school has 97 staff and the screen has no filter, so that
    control sits ~3,900px below the heading; a single capture spanning both
    would be a ~3,900px strip, against a corpus whose images are a few hundred
    pixels tall. Captured the readable region instead and left the Move control
    outstanding rather than shipping an unusable image or silently dropping a
    requirement.

- image: profile-overview-customisation-16.png
  captured: 2026-08-04
  as: staff
  path: >
    Staff tab → Security → Manage staff groups → permissions against
    "General Teacher" (group id 3) → Pupil Admin tab → Overview heading
  frame:
    mode: span
    selectors: >
      The "Overview" heading li and the ul.subcat immediately after it,
      holding both permission rows (Choose own Pupil Overview layout,
      Manage Pupil Overview layouts).
    padding: 8
  setup: >
    Group chosen: "General Teacher" — a restricted group that carries
    permissions and represents the "most teachers" the surrounding text
    describes. "Academic Staff" looks like the obvious choice but is an
    unrestricted group with no permissions assigned, so its permission
    screen is empty. Ticked "Choose own Pupil Overview layout" and left
    "Manage Pupil Overview layouts" unticked, per the brief.
  revert: >
    The tick was set in the form for the capture and deliberately NOT saved,
    so no permission on the demonstration school was actually changed.
  note: >
    Re-capture of a stale image. The old one described the manage permission
    as letting a user "create, edit, delete and recommend the layouts";
    recommendations are gone and this build reads "create, edit, delete and
    assign the layouts" (verified in includes/data/privileges.php:242).
    The old crop was 816px wide and sat inside the tab panel's borders. This
    one is 900px per house convention, so the panel's left and right borders
    are in shot. Framing mode 2 cannot clip horizontally, so matching the old
    width exactly was not possible without faking it.
