- image: parent-and-pupil-portal-09.png
  captured: 2026-08-04
  as: staff
  path: Pupils tab → Security → Manage permissions groups → privileges (Full Access group, id 1)
  frame:
    mode: span
    selectors: >
      Birthdays heading li, its permission row li (View birthdays);
      2 rows above from the Academic Goal Setting section (Capture academic
      goals, View academic goals); the Family heading li and its first 2
      permission rows (Request online detail update form, Upload family
      documents)
    padding: 8
  setup: >
    Group chosen: "Full Access" — the only pupil login group with any pupils
    assigned (3), against "No Academics", "No Access", "No Markbook" and
    "No Reports" which all have 0. View birthdays was already ticked for both
    Pupils and Families on this group (Full Access grants everything by
    default), so no change was made before capturing.
  revert: none
  note: >
    Re-captured 2026-08-04 (same day, fix round 1): the original capture used
    the browser's DejaVu Sans fallback because fonts.googleapis.com is
    blocked by the allowed-origins rail and no Open Sans/Arial was installed
    on the machine. Open Sans was installed locally and the browser
    restarted; this file is the re-capture, same framing and group, only the
    typeface differs (image height changed slightly, 386px content height
    became 421px, because Open Sans and DejaVu Sans have different metrics).

- image: parent-and-pupil-portal-10.png
  captured: 2026-08-04
  as: staff
  path: >
    Administration tab → Site Administration → Edit site settings
    (/admin/settings/site) → Pupils & Families tab → Widgets heading
  frame:
    mode: span
    selectors: >
      The "Widgets" h3 through the whole table row of the third birthday
      setting ("Names in the portal birthday widget"), taking the tr rather
      than its div.formelement — the formelement stops before the help-text
      column, so measuring it clips the help text.
    padding: 8
  setup: >
    "Birthdays visible in the portal" was already "All pupils in the school"
    and names were already "First name and surname initial". Photographs were
    on "Yes"; set to "No" and saved, so the image shows the defaults a school
    starts from, as the brief asks.
  revert: >
    Not reverted. Photographs off and names abbreviated are the documented
    defaults, and image 11 has to match this configuration.
  note: >
    The page has a sticky "Save settings" bar 82px tall that overlays the foot
    of the viewport. A capture sized to the span alone hides the last setting
    behind it, so the viewport height is span + padding + 82. The bar is in
    shot at the bottom as a result, which is honest — it is on the screen.

